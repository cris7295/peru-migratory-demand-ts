# Ejecución manual: instala dependencias y verifica regresiones con datos sintéticos.
# No descarga datos, entrena modelos ni ejecuta el pipeline mensual de producción.

name: Pipeline mensual (esqueleto)

on:
  workflow_dispatch:  # solo se ejecuta si alguien lo activa manualmente en GitHub

jobs:
  setup-check:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Confirmar que todo se instaló bien
        run: python -c "import pandas, prophet; print('Entorno listo ✅')"

      - name: Verificar calidad y regresiones con datos sintéticos
        run: python -m unittest discover -s tests -v
